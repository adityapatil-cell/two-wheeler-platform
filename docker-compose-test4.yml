version: '3.8'

# ─────────────────────────────────────────────────────────────────────────────
# TEST STACK: infra + the 4 services already pushed to Docker Hub
# (gateway, web-bff, platform-service, workshop-service).
#
# towing-service, location-service, marketplace-service NOT included yet —
# add them once their images are pushed too.
#
# Before running: replace <DOCKERHUB_USERNAME> with your real Docker Hub username.
#
# Usage:
#   docker-compose -f docker-compose-test4.yml pull
#   docker-compose -f docker-compose-test4.yml up -d
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ─────────────────────────── INFRA ───────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: two-wheeler-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_MULTIPLE_DATABASES: "twowheeler_platform,twowheeler_workshop"
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init-multiple-postgres-dbs.sh:/docker-entrypoint-initdb.d/init-multiple-postgres-dbs.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [two-wheeler-net]

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: two-wheeler-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks: [two-wheeler-net]

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: two-wheeler-kafka
    depends_on: [zookeeper]
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 10s
      retries: 10
    networks: [two-wheeler-net]

  redis:
    image: redis:7-alpine
    container_name: two-wheeler-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [two-wheeler-net]

  # ─────────────────────────── SERVICES (already on Docker Hub) ───────────────────────────

  platform-service:
    image: adityapatil1998/two-wheeler-platform-service:latest
    container_name: platform-service
    ports:
      - "8081:8081"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/twowheeler_platform
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      COGNITO_ISSUER_URI: https://cognito-idp.ap-south-1.amazonaws.com/ap-south-1_XXXXXXXX
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
    networks: [two-wheeler-net]

  workshop-service:
    image: adityapatil1998/two-wheeler-workshop-service:latest
    container_name: workshop-service
    ports:
      - "8082:8082"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/twowheeler_workshop
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      COGNITO_ISSUER_URI: https://cognito-idp.ap-south-1.amazonaws.com/ap-south-1_XXXXXXXX
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
    networks: [two-wheeler-net]

  web-bff:
    image: adityapatil1998/two-wheeler-web-bff:latest
    container_name: web-bff
    ports:
      - "8086:8086"
    environment:
      PLATFORM_SERVICE_URL: http://platform-service:8081
      WORKSHOP_SERVICE_URL: http://workshop-service:8082
      COGNITO_ISSUER_URI: https://cognito-idp.ap-south-1.amazonaws.com/ap-south-1_XXXXXXXX
    depends_on:
      - platform-service
      - workshop-service
    networks: [two-wheeler-net]

  gateway:
    image: adityapatil1998/two-wheeler-gateway:latest
    container_name: gateway
    ports:
      - "8080:8080"
    environment:
      PLATFORM_SERVICE_URL: http://platform-service:8081
      WORKSHOP_SERVICE_URL: http://workshop-service:8082
      WEB_BFF_URL: http://web-bff:8086
      COGNITO_ISSUER_URI: https://cognito-idp.ap-south-1.amazonaws.com/ap-south-1_XXXXXXXX
    depends_on:
      - platform-service
      - workshop-service
      - web-bff
    networks: [two-wheeler-net]

volumes:
  pgdata:

networks:
  two-wheeler-net:
    driver: bridge
