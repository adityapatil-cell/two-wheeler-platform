server:
  port: 8080

spring:
  application:
    name: gateway

  # ─── Cognito OIDC — validate JWT at gateway level ──────────────────────────
  security:
    oauth2:
      resourceserver:
        jwt:
          # Cognito JWKS endpoint — gateway validates every incoming JWT here
          # Format: https://cognito-idp.{region}.amazonaws.com/{userPoolId}
          issuer-uri: ${COGNITO_ISSUER_URI:https://cognito-idp.ap-south-1.amazonaws.com/ap-south-1_XXXXXXXX}
          jwk-set-uri: ${COGNITO_JWK_SET_URI:https://cognito-idp.ap-south-1.amazonaws.com/ap-south-1_XXXXXXXX/.well-known/jwks.json}

  # ─── Redis — session cache + rate limiting ─────────────────────────────────
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  # ─── Spring Cloud Gateway routes ───────────────────────────────────────────
  cloud:
    gateway:
      # Global CORS — allow React web app origin
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - ${WEB_APP_URL:http://localhost:3000}
              - ${WEB_APP_PROD_URL:https://twowheeler.com}
            allowedMethods:
              - GET
              - POST
              - PUT
              - PATCH
              - DELETE
              - OPTIONS
            allowedHeaders:
              - "*"
            allowCredentials: true
            maxAge: 3600

      # Default filters applied to ALL routes
      default-filters:
        - name: RequestRateLimiter
          args:
            redis-rate-limiter.replenishRate: 20     # 20 requests/sec per user
            redis-rate-limiter.burstCapacity: 40     # burst up to 40
            redis-rate-limiter.requestedTokens: 1
            key-resolver: "#{@userKeyResolver}"

      routes:

        # ─── Public routes — no JWT required ────────────────────────────────

        # Auth routes — register, verify OTP (public — no token yet)
        - id: auth-public
          uri: ${PLATFORM_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/v1/auth/**
          filters:
            - AddRequestHeader=X-Gateway-Source, two-wheeler-gateway

        # Public listing browse — no auth needed
        - id: marketplace-public
          uri: ${MARKETPLACE_SERVICE_URL:http://localhost:8084}
          predicates:
            - Path=/api/v1/listings/{id}
            - Method=GET
          filters:
            - AddRequestHeader=X-Gateway-Source, two-wheeler-gateway

        # Public garage info — no auth needed
        - id: garage-public
          uri: ${WORKSHOP_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/v1/garages/{id}
            - Method=GET
          filters:
            - AddRequestHeader=X-Gateway-Source, two-wheeler-gateway

        # Public reviews — no auth needed
        - id: reviews-public
          uri: ${PLATFORM_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/v1/reviews/target/**
            - Method=GET
          filters:
            - AddRequestHeader=X-Gateway-Source, two-wheeler-gateway

        # ─── Authenticated routes — JWT required ─────────────────────────────

        # Platform service — users, billing, notifications, reviews
        - id: platform-service
          uri: ${PLATFORM_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/v1/users/**, /api/v1/billing/**, /api/v1/notifications/**, /api/v1/reviews/**
          filters:
            - AddRequestHeader=X-Gateway-Source, two-wheeler-gateway

        # Workshop service — garages, repairs, inventory
        - id: workshop-service
          uri: ${WORKSHOP_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/v1/garages/**, /api/v1/repairs/**, /api/v1/inventory/**
          filters:
            - AddRequestHeader=X-Gateway-Source, two-wheeler-gateway

        # Towing service — tow requests, driver jobs
        - id: towing-service
          uri: ${TOWING_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/v1/tow/**
          filters:
            - AddRequestHeader=X-Gateway-Source, two-wheeler-gateway

        # Location tracking service — GPS positions, trip history
        - id: location-service
          uri: ${LOCATION_SERVICE_URL:http://localhost:8085}
          predicates:
            - Path=/api/v1/tracking/**
          filters:
            - AddRequestHeader=X-Gateway-Source, two-wheeler-gateway

        # Marketplace service — listings, search, escrow
        - id: marketplace-service
          uri: ${MARKETPLACE_SERVICE_URL:http://localhost:8084}
          predicates:
            - Path=/api/v1/listings/**, /api/v1/escrow/**
          filters:
            - AddRequestHeader=X-Gateway-Source, two-wheeler-gateway

        # Web BFF — aggregated endpoints for React web app
        - id: web-bff
          uri: ${WEB_BFF_URL:http://localhost:8086}
          predicates:
            - Path=/bff/**
          filters:
            - AddRequestHeader=X-Gateway-Source, two-wheeler-gateway

# ─── Actuator ────────────────────────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health, info, gateway, prometheus
  endpoint:
    health:
      show-details: when-authorized
    gateway:
      enabled: true

# ─── Logging ─────────────────────────────────────────────────────────────────
logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} %-5level [gateway] [traceId=%X{traceId}] %logger{36} - %msg%n"
  level:
    root: INFO
    com.twowheeler: DEBUG
    org.springframework.cloud.gateway: DEBUG   # shows route matching in dev
    org.springframework.security: WARN
